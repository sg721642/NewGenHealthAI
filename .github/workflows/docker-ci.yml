name: Container Build & Full-Stack Acceptance CI

on:
  push:
    branches:
      - main
      - fix/healthai-audit-premium-ui
      - fix/production-bootstrap-hardening
      - fix/track-pdfs-in-git-lfs
  pull_request:
    branches:
      - main
      - fix/healthai-audit-premium-ui
      - fix/production-bootstrap-hardening
      - fix/track-pdfs-in-git-lfs
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare Frontend Static Assets for Backend Serving Tests
        run: |
          mkdir -p backend/app/static
          if [ -f frontend/public/favicon.svg ]; then
            cp frontend/public/favicon.svg backend/app/static/favicon.svg
          fi
          if [ -f frontend/public/vite.svg ]; then
            cp frontend/public/vite.svg backend/app/static/vite.svg
          fi
          if [ -f frontend/index.html ]; then
            cp frontend/index.html backend/app/static/index.html
          fi

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
          ENV: testing
        run: |
          pytest backend/tests/ -v

  frontend-tests:
    name: Frontend Unit Tests, Lint & Build (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          cd ..

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint
          cd ..

      - name: Run Frontend Vitest Suite
        run: |
          cd frontend
          npm test -- --run
          cd ..

      - name: Run Standalone Frontend Production Build
        run: |
          cd frontend
          npm run build:standalone
          cd ..

  docker-smoke-test:
    name: Build & Smoke-Test Integrated Container
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Reproducibility
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build:standalone
          cd ..

      - name: Build Root Docker Image
        run: |
          echo "Building integrated NewGenHealthAI Docker image..."
          docker build -t newgenhealthai:test .

      - name: Start Integrated Test Container
        run: |
          echo "Starting test container with synthetic non-production configuration..."
          docker run -d \
            --name healthai-test \
            -p 7860:7860 \
            -e PORT=7860 \
            -e ALLOW_MODEL_DOWNLOADS=false \
            -e SESSION_SECRET_KEY=synthetic_test_secret_key_minimum_32_characters_ci \
            -e ALLOWED_ORIGINS=http://localhost:7860 \
            -e TRUSTED_PROXIES=127.0.0.1,::1 \
            newgenhealthai:test

      - name: Wait for Container Readiness
        run: |
          echo "Waiting for backend service to report healthy on port 7860..."
          READY=0
          for i in {1..30}; do
            if curl -s -f http://localhost:7860/api/v1/health | grep -q '"status":"healthy"'; then
              echo "Container health check passed on attempt $i!"
              READY=1
              break
            fi
            echo "Waiting for health endpoint... (attempt $i/30)"
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "FAILED: Container failed to report healthy within 60s"
            exit 1
          fi

      - name: Verify Non-Root Execution
        run: |
          CONTAINER_USER=$(docker exec healthai-test whoami)
          echo "Container executing as user: $CONTAINER_USER"
          if [ "$CONTAINER_USER" != "user" ]; then
            echo "FAILED: Container must run as non-root user 'user'"
            exit 1
          fi

      - name: Smoke-Test Static Frontend Serving
        run: |
          HTML_OUTPUT=$(curl -sS http://localhost:7860/)
          echo "Verifying root HTML title..."
          echo "$HTML_OUTPUT" | grep -q "NewGenHealthAI"
          echo "Root HTML verified."

      - name: Smoke-Test Unauthenticated Security Enforcement
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7860/api/v1/sessions)
          echo "Unauthenticated /sessions status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "401" ]; then
            echo "FAILED: Expected 401 Unauthorized, received $HTTP_STATUS"
            exit 1
          fi

      - name: Smoke-Test Authentication & Session Lifecycle
        run: |
          echo "Registering synthetic user in container..."
          REG_RES=$(curl -sS -X POST http://localhost:7860/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_container_user","password":"ContainerPassword123!"}')
          TOKEN=$(echo "$REG_RES" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "FAILED: Could not extract token from registration response"
            exit 1
          fi
          echo "Synthetic user registered successfully; bearer token acquired (redacted, length: ${#TOKEN})"

          echo "Listing sessions with authenticated token..."
          SESS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" http://localhost:7860/api/v1/sessions)
          if [ "$SESS_STATUS" != "200" ]; then
            echo "FAILED: Authenticated /sessions returned HTTP $SESS_STATUS (expected 200)"
            exit 1
          fi
          echo "Authenticated /sessions returned HTTP 200 OK"

          echo "Creating new chat consultation..."
          NEW_CHAT_RES=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" http://localhost:7860/api/v1/new-chat)
          if ! echo "$NEW_CHAT_RES" | grep -q '"session_id"'; then
            echo "FAILED: Expected session_id in new-chat response"
            exit 1
          fi
          echo "New chat consultation created successfully (session_id received)"

      - name: Collect Container Diagnostics on Failure
        if: failure()
        run: |
          echo "--- Container Logs (last 100 lines) ---"
          docker logs --tail 100 healthai-test || true

      - name: Teardown Test Container
        if: always()
        run: |
          docker rm -f healthai-test || true
